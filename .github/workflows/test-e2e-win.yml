name: Test end-to-end

on: 
  workflow_dispatch: {}
  # push:
  #   branches:
  #       - develop

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm run test:e2e
