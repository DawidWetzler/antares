# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # 7.0 ships the Go compiler and drops lib/typescript.js, so there is no importable API
      # at all: ts-loader (all three webpack configs) and ts-node (the test runner) both break
      # on it, and only `tsc --noEmit` still works. The API is due back in 7.1, which this
      # range lets straight through — the block lifts itself, no diary entry needed.
      - dependency-name: "typescript"
        versions: ["7.0.x"]

  # Keeps the SHA-pinned third-party actions current: Dependabot rewrites both
  # the SHA and the version comment when a new release ships.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
