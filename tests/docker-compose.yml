# Test databases for `npm run test:integration`.
# Ports are non-default on purpose: they must not clash with a local MySQL/Postgres.
services:
  mysql:
    image: percona/percona-server:8.0.46
    command: --secure-file-priv=/tmp
    environment:
      MYSQL_ROOT_PASSWORD: antares
      MYSQL_DATABASE: antares_test
    ports:
      - '53306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pantares']
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: antares
      POSTGRES_DB: antares_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d antares_test']
      interval: 2s
      timeout: 5s
      retries: 30

  # Stock Firebird 5: Srp256 and wire encryption left at their defaults, because that is what a
  # user's server looks like. Weakening it here would only hide a driver that cannot reach one.
  firebird:
    image: firebirdsql/firebird:5
    environment:
      FIREBIRD_ROOT_PASSWORD: antares
      FIREBIRD_DATABASE: antares_test.fdb
    ports:
      - '53050:3050'
    healthcheck:
      # Over inet:// on purpose: a bare path lets isql open the file with the embedded engine,
      # which locks the server out of its own database and rejects whatever attaches during the
      # probe. Single quotes inside the shell: with double quotes it expands `$database` and asks
      # for a table called `rdb`.
      test: ['CMD-SHELL', "echo 'SELECT 1 FROM rdb$$database;' | isql -q -u SYSDBA -p antares 'inet://localhost:3050//var/lib/firebird/data/antares_test.fdb'"]
      interval: 2s
      timeout: 5s
      retries: 30
